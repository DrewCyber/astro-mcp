[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-mcp"
version = "1.0.1"
requires-python = ">=3.11"
description = "Astrological MCP Server — high-precision astrology tools for LLM agents"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "mcp>=1.0.0",
    "pyswisseph>=2.10.3.2",
    "geopy>=2.4.0,<3",
    "timezonefinder>=6.5.0,<9",
    "pydantic>=2.5.0,<3",
    "pydantic-settings>=2.1.0,<3",
]

[project.urls]
Homepage = "https://github.com/DrewCyber/astro-mcp"
Repository = "https://github.com/DrewCyber/astro-mcp"
Changelog = "https://github.com/DrewCyber/astro-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Floor-pinned for features, upper-bounded so a future major release of a
# dev tool cannot break CI overnight.
dev = [
    "pytest>=7.4.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "ruff>=0.2.0,<1",
    "mypy>=1.8.0,<3",
    "pytest-cov>=4.1.0,<8",
]

[project.scripts]
astro-mcp = "astro_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astro_mcp = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Naive datetimes are load-bearing here: a birth time is a *wall-clock* local
# time, and attaching a tzinfo before the DST-fold resolution in
# geocoding.local_to_utc would defeat the ambiguity handling.
ignore = ["DTZ001", "DTZ007", "FURB162"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# The MCP SDK ships untyped decorators (@server.list_tools / @server.call_tool),
# so strict mode flags every handler they wrap. Scoped to the server module so
# the rest of the package stays fully strict.
[[tool.mypy.overrides]]
module = "astro_mcp.server"
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=astro_mcp --cov-report=term-missing --cov-fail-under=83"
