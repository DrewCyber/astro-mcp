[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-mcp"
version = "1.2.0"
requires-python = ">=3.11"
description = "Astrological MCP Server — high-precision astrology tools for LLM agents"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    # <3: 2.x replaced 1.x decorator registration with constructor handlers
    # (on_list_tools / on_call_tool) and added Server.streamable_http_app(),
    # which this package builds on. A future major may shift again.
    "mcp>=2.1,<3",
    "pyswisseph>=2.10.3.2",
    "geopy>=2.4.0,<3",
    "timezonefinder>=6.5.0,<9",
    "pydantic>=2.5.0,<3",
    "pydantic-settings>=2.1.0,<3",
    # Imported directly by http_server.py; also pulled transitively by mcp,
    # declared here because we rely on their APIs, not the SDK's internals.
    "starlette>=0.37",
    "uvicorn>=0.31",
    # zoneinfo fallback where the OS lacks a tz database (slim containers).
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/DrewCyber/astro-mcp"
Repository = "https://github.com/DrewCyber/astro-mcp"
Changelog = "https://github.com/DrewCyber/astro-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Floor-pinned for features, upper-bounded so a future major release of a
# dev tool cannot break CI overnight.
dev = [
    "pytest>=7.4.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "ruff>=0.2.0,<1",
    "mypy>=1.8.0,<3",
    "pytest-cov>=4.1.0,<8",
]

[project.scripts]
astro-mcp = "astro_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astro_mcp = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Naive datetimes are load-bearing here: a birth time is a *wall-clock* local
# time, and attaching a tzinfo before the DST-fold resolution in
# geocoding.local_to_utc would defeat the ambiguity handling.
ignore = ["DTZ001", "DTZ007", "FURB162"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]

[tool.mypy]
# 3.12 rather than the 3.11 runtime floor: numpy 2.5 stubs (transitive via
# timezonefinder) use PEP 695 syntax unparseable under a 3.11 target. Syntax
# floor for our own code stays enforced by ruff (target-version py311).
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=astro_mcp --cov-report=term-missing --cov-fail-under=88"
