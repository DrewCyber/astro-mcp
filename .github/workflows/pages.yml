name: Pages

# Deploys the static landing in docs/ to GitHub Pages. Requires the one-time
# repo setting Settings -> Pages -> Build and deployment -> Source: GitHub
# Actions; until it is flipped, deploy-pages fails with "Pages not enabled".
on:
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push supersedes the in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Plain HTML/CSS — nothing to build, upload docs/ as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
