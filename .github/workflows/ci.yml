name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Swiss Ephemeris data
        id: ephe-cache
        uses: actions/cache@v4
        with:
          path: ephe
          key: ephe-se1-v1

      # The .se1 files are not in the repo. Without them pyswisseph silently
      # downgrades to the low-precision Moshier ephemeris, so the accuracy
      # assertions must not run against a missing data set.
      - name: Download ephemeris data
        if: steps.ephe-cache.outputs.cache-hit != 'true'
        run: bash scripts/download_ephe.sh

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy src

      - name: Test
        # Coverage floor lives in pyproject addopts (--cov-fail-under=83).
        run: pytest -q

  # The remote-MCP image is what one-click deploys (Render, Cloud Run, Koyeb)
  # build from. Built only for version tags (release moments) — everyday
  # pushes are already covered by the test matrix above.
  docker-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "astro-mcp:${GITHUB_REF_NAME}" .

      - name: Smoke-test HTTP transport
        run: |
          docker run -d --name smoke -p 8080:8080 astro-mcp:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 2
          done
          curl -fsS -X POST http://localhost:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | grep -o '"calculate_natal_chart"'
          docker rm -f smoke
