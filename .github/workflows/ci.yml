name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Swiss Ephemeris data
        id: ephe-cache
        uses: actions/cache@v4
        with:
          path: ephe
          key: ephe-se1-v1

      # The .se1 files are not in the repo. Without them pyswisseph silently
      # downgrades to the low-precision Moshier ephemeris, so the accuracy
      # assertions must not run against a missing data set.
      - name: Download ephemeris data
        if: steps.ephe-cache.outputs.cache-hit != 'true'
        run: bash scripts/download_ephe.sh

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy src

      - name: Test
        run: pytest -q --cov=astro_mcp --cov-report=term-missing
